name: Windows kurulumu

on:
  push:
    branches:
      - main
      - data/labor-records-1.1.4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Hesaplama testleri
        run: node tests/run-calc.mjs
      - name: Excel raporu testi
        run: node tests/export.test.mjs
      - name: Windows kurulum dosyasını oluştur
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -eq 'main') {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build-installer.ps1 -UnsignedDevelopmentBuild
          } elseif ($env:GITHUB_REF_NAME -eq 'data/labor-records-1.1.4') {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build-installer.ps1 -UnsignedDevelopmentBuild -SeedDataPath 'data\edge-labor-1.1.4.json'
          } else {
            throw "Desteklenmeyen dal: $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) { throw "Derleme başarısız: $LASTEXITCODE" }
          $setup = Get-Item -LiteralPath 'dist\BTXPrice-Setup-1.1.4.exe' -ErrorAction Stop
          if ($setup.Length -lt 1000000) { throw 'Kurulum dosyası beklenenden küçük.' }
          if ($env:GITHUB_REF_NAME -ne 'main' -and
              -not (Test-Path -LiteralPath 'build\installer-app\seed-data.js')) {
            throw 'Verili kurulumda başlangıç kayıtları yok.'
          }
      - name: İndirilebilir sürümü yayımla
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = 'dist\BTXPrice-Setup-1.1.4.exe'
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('dist\SHA256SUMS.txt', "$hash  BTXPrice-Setup-1.1.4.exe`n")
          $assets = @($setup, 'dist\SHA256SUMS.txt')
          $releaseFlags = @()
          if ($env:GITHUB_REF_NAME -eq 'main') {
            $tag = "main-1.1.4-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $title = 'BTX Price 1.1.4 — boş kurulum'
            $notes = 'Windows kurulumu. Başlangıçta işletme kaydı içermez. Set başlığındaki sipariş adedi, lot, kod ve ambalaj profili tek sıradadır. Malzeme tüketimi malzeme birimine göre cm ölçülerinden hesaplanır; set adı üstte düzenlenir. Kurulumda masaüstü kısayolu isteğe bağlıdır. Dijital kod imzası yoktur; Windows güvenlik uyarısı veya Smart App Control engeli görülebilir.'
          } elseif ($env:GITHUB_REF_NAME -eq 'data/labor-records-1.1.4') {
            $tag = "labor-1.1.4-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $title = 'BTX Price 1.1.4 — uyarlanmış işçilik kayıtlarıyla'
            $notes = 'Windows kurulumu, yeni kullanıcı profilinde uyarlanmış Edge işçilik kayıtlarıyla açılır. Mevcut kayıtların üzerine yazmaz. Set başlığındaki dört alan tek sıradadır; malzeme tüketimi malzeme birimine göre cm ölçülerinden hesaplanır. Orijinal Edge ve masaüstü JSON yedekleri de sürümde bulunur. Bu özel sürüm işletme verileri içerir. Dijital kod imzası yoktur; Windows güvenlik uyarısı veya Smart App Control engeli görülebilir.'
            $assets += @('data\edge-labor-1.1.4.json', 'data\desktop-labor-1.1.4.json', 'data\edge-2026-11-23.json', 'data\desktop-2026-11-23.json')
            $releaseFlags += '--prerelease'
          } else {
            throw "Desteklenmeyen dal: $env:GITHUB_REF_NAME"
          }
          [IO.File]::WriteAllText('dist\RELEASE_NOTES.txt', $notes)
          gh release create $tag @assets @releaseFlags --latest=false --target $env:GITHUB_SHA --title $title --notes-file 'dist\RELEASE_NOTES.txt'
          if ($LASTEXITCODE -ne 0) { throw "GitHub sürümü yayımlanamadı: $LASTEXITCODE" }
